<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Forge Run"><title>Running Training Plan</title>
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#10222f;--mute:#5d7080;--acc:#2457ff;--line:#d8e1e8;--run:#2457ff;--str:#7a4dff;--bike:#0e9f8e;--rest:#8a99a6;--race:#e89a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1820;--card:#15252f;--ink:#e9f1f6;--mute:#93a8b6;--acc:#6f93ff;--line:#243845;--run:#6f93ff;--str:#a58bff;--bike:#37cdbb;--rest:#7d8f9c;--race:#ffb830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1820;--card:#15252f;--ink:#e9f1f6;--mute:#93a8b6;--acc:#6f93ff;--line:#243845;--run:#6f93ff;--str:#a58bff;--bike:#37cdbb;--rest:#7d8f9c;--race:#ffb830;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
#hdr,main{max-width:640px;margin:0 auto;padding-left:14px;padding-right:14px}
#hdr{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
main{padding-top:12px;padding-bottom:32px}
.brand{font:700 24px 'Barlow Condensed',system-ui,sans-serif;letter-spacing:.02em}
.who{display:flex;gap:6px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.ic{background:var(--acc);color:#fff;width:40px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1,h2,h3{font-family:'Barlow Condensed',system-ui,sans-serif;margin:0}
.big{font-size:40px;line-height:1;font-weight:700}
.kc{margin-top:6px;font-weight:600;color:var(--acc)}
.lv{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:12px;margin-bottom:8px}
.lv span{display:block;font-size:14px;color:var(--mute);margin-top:2px;font-weight:500}
.lv.on{border-color:var(--acc)}
.mute{color:var(--mute);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.w{border-left:6px solid var(--run)}
.w.str{border-color:var(--str)}.w.bike{border-color:var(--bike)}.w.rest{border-color:var(--rest)}.w.race{border-color:var(--race)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.nav button{background:var(--bg);color:var(--ink);width:40px;height:40px;font-size:22px}
.nav div{text-align:center}
.w h2{font-size:30px;margin:4px 0}
ul.l{padding-left:20px;margin:10px 0}ul.l li{margin:5px 0}
.done{width:100%;padding:13px;font-weight:600;background:var(--acc);color:#fff;font-size:17px}
.done.on{background:var(--bike)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{padding:13px 14px;font:700 20px 'Barlow Condensed',system-ui,sans-serif;display:flex;justify-content:space-between;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row.today{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.row .d{width:64px;font-size:13px;color:var(--mute)}.row .t{flex:1}
.row.ok .t{text-decoration:line-through;opacity:.6}
.f{display:block;margin:12px 0 4px;font-weight:600}
.f2{display:flex;gap:8px;align-items:center}
.btn{background:var(--acc);color:#fff;padding:10px 14px;font-weight:600}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:#d64545}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
:root{--acc:#ff5a36;--acc2:#ff8a2b;--run:var(--acc);--bg:color-mix(in srgb,var(--acc) 7%,#fff);--line:color-mix(in srgb,var(--acc) 16%,#e6e9ec)}
:root[data-accent=ocean]{--acc:#2457ff;--acc2:#1d8fe8}
:root[data-accent=forest]{--acc:#12945a;--acc2:#3aa86a}
:root[data-accent=berry]{--acc:#d6246e;--acc2:#f0508a}
@media(prefers-color-scheme:dark){
:root:not([data-theme="light"]){--acc:#ff6a45;--acc2:#ff9340;--run:var(--acc);--bg:color-mix(in srgb,var(--acc) 6%,#0e1114);--card:color-mix(in srgb,var(--acc) 5%,#171b1f);--line:color-mix(in srgb,var(--acc) 16%,#262c31)}
:root:not([data-theme="light"])[data-accent=ocean]{--acc:#4d78ff;--acc2:#2aa0f0}
:root:not([data-theme="light"])[data-accent=forest]{--acc:#1fa86a;--acc2:#4cc27c}
:root:not([data-theme="light"])[data-accent=berry]{--acc:#e6407f;--acc2:#ff6b9d}}
:root[data-theme="dark"]{--acc:#ff6a45;--acc2:#ff9340;--run:var(--acc);--bg:color-mix(in srgb,var(--acc) 6%,#0e1114);--card:color-mix(in srgb,var(--acc) 5%,#171b1f);--line:color-mix(in srgb,var(--acc) 16%,#262c31)}
:root[data-theme="dark"][data-accent=ocean]{--acc:#4d78ff;--acc2:#2aa0f0}
:root[data-theme="dark"][data-accent=forest]{--acc:#1fa86a;--acc2:#4cc27c}
:root[data-theme="dark"][data-accent=berry]{--acc:#e6407f;--acc2:#ff6b9d}
.brand{font-size:28px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card,details{border-radius:18px;border-color:transparent;box-shadow:0 2px 14px color-mix(in srgb,var(--acc) 10%,transparent)}
.ic,.btn,.done{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.btn.g{background:var(--bg)}.btn.r{background:#d64545}.done.on{background:var(--bike)}
.ic{border-radius:12px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:18px}
.hero .big{font-size:46px;letter-spacing:.01em}
.hero .mute,.hero .kc{color:rgba(255,255,255,.92)}
.hero .bar{background:rgba(255,255,255,.3);height:12px}.hero .bar i{background:#fff}
.bar i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.w{--c:var(--run);border-left:0;border-top:6px solid var(--c);background:linear-gradient(170deg,color-mix(in srgb,var(--c) 13%,var(--card)),var(--card) 55%)}
.w.str{--c:var(--str)}.w.bike{--c:var(--bike)}.w.rest{--c:var(--rest)}.w.race{--c:var(--race)}
.w h2{font-size:34px}
.kc{color:var(--c,var(--acc))}
.lv.on{background:color-mix(in srgb,var(--acc) 10%,var(--card))}
details[open] summary{color:var(--acc)}
.row{box-shadow:inset 5px 0 var(--run)}.row.str{box-shadow:inset 5px 0 var(--str)}.row.bike{box-shadow:inset 5px 0 var(--bike)}.row.rest{box-shadow:inset 5px 0 var(--rest)}.row.race{box-shadow:inset 5px 0 var(--race)}
.row .d{padding-left:4px}
.sw{display:flex;gap:8px;margin-top:10px}
.swb{flex:1;background:none;color:var(--ink);padding:6px;border:2px solid transparent;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px}
.swb i{display:block;width:100%;height:38px;border-radius:10px}
.swb.on{border-color:var(--acc)}

html:root[data-accent=forge]{--acc:#e8481e;--acc2:#f7931e;--run:#f26a21;--bg:#000;--card:rgba(20,10,6,.74);--line:#4a210f;--ink:#fff1e6;--mute:#d2ab90;--str:#b58cff;--bike:#2fd4c0;--rest:#9a8577;color-scheme:dark}
html[data-accent=forge] .card,html[data-accent=forge] details{border:1px solid var(--line);box-shadow:0 0 22px rgba(232,72,30,.12)}
html[data-accent=forge] .hero{border-color:transparent;box-shadow:0 0 30px rgba(247,147,30,.3)}
html[data-accent=forge] .lv,html[data-accent=forge] .nav button,html[data-accent=forge] .btn.g{background:#1c0f09}
html[data-accent=forge] select,html[data-accent=forge] input,html[data-accent=forge] textarea{background:#1c0f09}
.lg{display:inline-block;width:38px;height:38px;margin-right:9px;vertical-align:middle;background:var(--logo) center/contain no-repeat;border-radius:50%}
.brand{display:flex;align-items:center}.brand span{font-weight:800;font-size:30px;line-height:1.05;letter-spacing:.07em;text-transform:uppercase;filter:drop-shadow(0 2px 3px color-mix(in srgb,var(--acc) 38%,transparent)) drop-shadow(0 6px 12px color-mix(in srgb,var(--acc) 22%,transparent))}
.brand .lg{box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 35%,transparent)}
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}

html[data-bg]:not([data-bg=none]) body{background:linear-gradient(rgba(0,0,0,.46),rgba(0,0,0,.56)),var(--bgi) center center/contain no-repeat fixed,#000}
html[data-bg=logo]{--bgi:var(--logo)}html[data-bg=r1]{--bgi:var(--r1)}html[data-bg=r2]{--bgi:var(--r2)}html[data-bg=r3]{--bgi:var(--r3)}html[data-bg=r4]{--bgi:var(--r4)}html[data-bg=r5]{--bgi:var(--r5)}
html:root[data-bg]:not([data-bg=none]):not([data-accent=forge]){--bg:#000;--card:color-mix(in srgb,color-mix(in srgb,var(--acc) 5%,#171b1f) 74%,transparent);--line:color-mix(in srgb,var(--acc) 22%,#262c31);--ink:#f2f4f6;--mute:#a3b0ba;color-scheme:dark}
html:root[data-bg]:not([data-bg=none])[data-accent=sunrise]{--acc:#ff6a45;--acc2:#ff9340}
html:root[data-bg]:not([data-bg=none])[data-accent=ocean]{--acc:#4d78ff;--acc2:#2aa0f0}
html:root[data-bg]:not([data-bg=none])[data-accent=forest]{--acc:#1fa86a;--acc2:#4cc27c}
html:root[data-bg]:not([data-bg=none])[data-accent=berry]{--acc:#e6407f;--acc2:#ff6b9d}
.sw.bgs{flex-wrap:wrap}.bgs .swb{flex:0 0 calc(25% - 6px)}
button.lg{padding:0;border:0;cursor:pointer;flex:none;box-shadow:0 0 0 2px var(--acc);-webkit-tap-highlight-color:transparent}
button.lg[aria-expanded=true]{box-shadow:0 0 0 3px var(--acc2,var(--acc))}
#menu{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 64px);left:max(14px,calc(50% - 306px));min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;color:var(--ink);padding:13px 14px;font-weight:600;font-size:17px;border-radius:12px}
#menu button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
html[data-accent=forge] #menu,html[data-bg]:not([data-bg=none]) #menu{background:rgba(10,6,4,.97)}
/* Plan name: rich multi-color gradient */
:root{--g0:#ff3d6e;--g3:#ffb21e}
html[data-accent=forge]{--g0:#ff2d2d;--g3:#ffd23f}
html[data-accent=sunrise]{--g0:#ff3d6e;--g3:#ffc23a}
html[data-accent=ocean]{--g0:#7a5cff;--g3:#22d6c0}
html[data-accent=forest]{--g0:#0aa08a;--g3:#a6dc3c}
html[data-accent=berry]{--g0:#9b3dff;--g3:#ff9a5a}
.brand{background:none}
.brand span{background:linear-gradient(95deg,var(--g0) 0%,var(--acc) 30%,var(--acc2) 62%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-right:.12em}

.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.st{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.st b{display:block;font:700 26px/1.1 'Barlow Condensed',system-ui,sans-serif}
.st span{font-size:13px;color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.tabs button{flex:1 1 28%;padding:10px 2px;background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;border:1px solid var(--line)}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.sub{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.or{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:15px}
.or .d{width:64px;font-size:13px;color:var(--mute)}.or .t{flex:1}.or .s{font-size:13px;white-space:nowrap}
.ab-g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ab{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.ab .ae{font-size:30px}.ab b{display:block;font-size:15px}.ab span{display:block;font-size:12px;color:var(--mute);margin:2px 0 4px}
.ab em{font-style:normal;font-size:13px;font-weight:600;color:var(--acc)}
.ab.off{opacity:.5;filter:grayscale(1)}.ab.off em{color:var(--mute)}
.h3s{margin:14px 0 4px}

#certp{display:none;position:fixed;inset:0;z-index:90;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
#certp.on{display:block}
.cwrap{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 40px;color:#fff1e6}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cbar b{font:700 22px 'Barlow Condensed',system-ui,sans-serif}
.cwrap .card{color:var(--ink)}
.cw{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.cs{position:absolute;left:0;top:0;width:1123px;height:794px;transform-origin:0 0;overflow:hidden;background:#000;color:#fff1e6;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cs *{box-sizing:border-box}
.cs .cb{position:absolute;inset:0;background:var(--logo) center/auto 690px no-repeat;opacity:.2}
.cs .cf1{position:absolute;inset:20px;border:4px solid #e8481e}
.cs .cf2{position:absolute;inset:34px;border:1.5px solid #f7931e}
.cs .cc{position:absolute;inset:50px 80px 46px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.cs .c1{font-size:26px;font-weight:700;letter-spacing:.45em;color:#f7931e;padding-left:.45em}
.cs .c1s{font-size:14px;letter-spacing:.5em;color:#d2ab90;margin-top:2px;padding-left:.5em}
.cs .ct{font-size:92px;line-height:.95;font-weight:800;letter-spacing:.06em;color:#ff6a2b;margin-top:2px}
.cs .ct2{font-size:34px;font-weight:600;letter-spacing:.42em;color:#fff1e6;padding-left:.42em}
.cs .cp{font:italic 20px Georgia,'Times New Roman',serif;color:#d2ab90}
.cs .cn{font:italic 700 66px/1.15 Georgia,'Times New Roman',serif;color:#ffb347;border-bottom:2px solid #e8481e;padding:0 40px 4px;min-width:520px;max-width:900px}
.cs .cn.sm{font-size:46px}
.cs .cd{font-size:24px;line-height:1.35;color:#fff1e6}
.cs .cd b{color:#ffb347;font-weight:700}
.cs .cd2{font-size:20px;color:#d2ab90;letter-spacing:.04em}
.cs .cst{display:flex;gap:14px}
.cs .cst div{border:1.5px solid #6b3216;background:rgba(0,0,0,.35);border-radius:8px;padding:6px 20px;min-width:150px}
.cs .cst b{display:block;font-size:34px;line-height:1.1;color:#ff8a2b;font-weight:800}
.cs .cst span{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#d2ab90}
.cs .cfo{display:flex;width:100%;justify-content:space-between;align-items:flex-end;gap:30px}
.cs .cfo div{flex:1;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#d2ab90}
.cs .cfo div b{display:block;font:italic 700 22px Georgia,serif;letter-spacing:0;text-transform:none;color:#fff1e6;border-bottom:1.5px solid #f7931e;padding-bottom:3px;margin-bottom:5px;min-height:34px}
.cs.light{background:#fffaf3;color:#2a1608}
.cs.light .cb{opacity:.11}
.cs.light .cf1{border-color:#d9410f}.cs.light .cf2{border-color:#f08a24}
.cs.light .c1{color:#c2410c}.cs.light .c1s,.cs.light .cp,.cs.light .cd2,.cs.light .cst span,.cs.light .cfo div{color:#6b4a35}
.cs.light .ct{color:#d9410f}.cs.light .ct2,.cs.light .cd,.cs.light .cfo div b{color:#2a1608}
.cs.light .cn{color:#b4360a;border-color:#d9410f}.cs.light .cd b{color:#b4360a}
.cs.light .cst div{background:rgba(255,255,255,.6);border-color:#e8b48f}.cs.light .cst b{color:#d9410f}
.cs.light .cfo div b{border-color:#d9410f}
.cert-open{overflow:hidden}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 body.cert-open>*:not(#certp){display:none!important}
 #certp{display:block!important;position:static!important;background:none!important;overflow:visible!important}
 .noprint{display:none!important}
 .cwrap{max-width:none!important;padding:0!important}
 .cw{width:297mm!important;height:210mm!important;min-width:0!important;border-radius:0!important;box-shadow:none!important;overflow:hidden!important}
 .cs{transform:none!important}
}
.bkt{margin:8px 0 2px;font-size:13px}
.bk{display:grid;grid-template-columns:minmax(88px,1.5fr) .6fr .9fr .9fr .9fr;gap:4px;padding:6px 0;border-top:1px solid var(--line);align-items:center}
.bk span:nth-child(n+2){text-align:right}
.bk.h{border:0;color:var(--mute);font-size:12px;padding-bottom:2px}
.bk.t{font-weight:700;border-top:2px solid var(--line)}

<script>
const $=s=>document.querySelector(s),KEY='hm-trainer-v1';
const RACES={k5:{n:'5K',km:5,g:28,gn:12,gx:60,l0:4,lp:10,rw:3,tp:7,def:56,max:84,min:21,se:0,sh:25,u:0,v:0,tm:20,te:28},k10:{n:'10K',km:10,g:58,gn:25,gx:120,l0:5,lp:14,rw:5,tp:9,def:70,max:112,min:28,se:0,sh:10,u:0,v:0,tm:30,te:40},half:{n:'Half marathon',km:21.0975,g:120,gn:60,gx:210,l0:8,lp:19,rw:6,tp:13,def:111,max:120,min:27,se:0,sh:0,u:0,v:0},full:{n:'Full marathon',km:42.195,g:240,gn:120,gx:420,l0:10,lp:32,rw:8,tp:18,def:139,max:168,min:55,se:0,sh:-10,u:0,v:0},ultra:{n:'Ultra marathon (50 km)',dm:50,km:50,g:330,gn:180,gx:1800,l0:12,lp:35,rw:10,tp:20,def:167,max:196,min:55,se:-100,sh:-60,u:1,v:0},trail:{n:'Ultra trail run (50 km)',dm:32,km:50,g:480,gn:300,gx:2400,l0:12,lp:32,rw:10,tp:20,def:167,max:196,min:55,se:-200,sh:-180,u:1,v:45}};
const LV={beginner:{k:'b',n:'Beginner',d:'New to running, or under about 20 km a week. Gentle build, walk breaks and easy cross-training.',gm:1.2,vm:.85},semi:{k:'s',n:'Semi-elite',d:'Running 40+ km a week and racing regularly. Speed work, tempo runs and strength.',gm:.85,vm:1},elite:{k:'e',n:'Elite',d:'Running 80+ km a week and racing competitively. Bigger volume, harder intervals, fast-finish long runs.',gm:.68,vm:1.15}};
const rc=p=>{const B0=RACES[p.race||'half'],R={...B0,g:Math.round(B0.g*LV[p.level||'semi'].gm/5)*5};if(!R.u)return R;const km=Math.max(B0.dm,Math.min(100,p.dist||50)),x=km-50;return{...R,km,n:R.n.replace('50',km),g:Math.round(R.g*km/50*(1+x/500)/5)*5,gn:Math.round(R.gn*km/50),lp:Math.min(Math.round(km*.8),Math.round(R.lp+x*(R.v?.2:.15))),def:Math.round(R.def+x*.66),max:Math.round(R.max+x*.7),min:Math.round(R.min+x*.56)}};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fp=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fT=m=>m<60?m+':00':Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+':00';
const bioOk=p=>!!(p.age&&p.sex&&p.ht);
const bmi=p=>(p.weight||70)/Math.pow((p.ht||170)/100,2);
const mhr=p=>Math.round(208-.7*(p.age||30));
const hz=(p,a,b)=>p.age?' · heart rate about '+Math.round(mhr(p)*a)+'–'+Math.round(mhr(p)*b)+' bpm':'';
const agv=p=>{const a=p.age||30;return(a<18?.85:a<40?1:a<50?.95:a<60?.88:.8)*(bmi(p)>=30?.9:1)};
const agV=p=>{const v=LV[p.level||'semi'];return{...v,vm:v.vm*agv(p)}};
const bf=p=>{const a=p.age||30;return(p.sex==='f'?1.08:1)*(a<18?1.03:1+Math.max(0,Math.min(a,70)-35)*.004)};
const dg=p=>{const R=rc(p);return Math.min(R.gx,Math.max(R.gn,Math.round(R.g*bf(p))))};
const kf=p=>(p.sex==='f'?.93:1)*(1-Math.min(.12,Math.max(0,(p.age||30)-30)*.003));
const kc=(d,p)=>Math.round(d.kp*(p.weight||70)*kf(p));
const sxEx=(p,A)=>{const a=p.age||30,o=[];
 if(p.sex==='f')o.push(A?['Clamshells','15 per side']:['Single-leg glute bridge','10 per leg']);

 if(a>=40)o.push(['Single-leg balance','30 sec per leg']);
 if(a>=50)o.push(['Hip and ankle mobility flow','3 min']);
 return o};
const bioLine=p=>`<div class="mute">👤 ${LV[p.level||'semi'].n} · ${p.age} yrs · ${p.sex==='f'?'Female':'Male'} · ${p.ht} cm · ${p.weight||70} kg · BMI ${bmi(p).toFixed(1)} · Max HR ≈ ${mhr(p)} bpm</div><div class="mute">Training is adjusted for your age, sex and level.</div>${p.mode==='hyb'?'<div class="mute">🔀 Style: Hybrid (run + ride + strength, no gym)</div>':''}`;
function bioF(p){const sx=(k,n)=>`<button class="lv${p.sex===k?' on':''}" style="flex:1;text-align:center;margin:0" onclick="setBio('sex','${k}')"><b>${n}</b></button>`;
 return`<label class="f" for="ag">Age and height</label><div class="f2"><input id="ag" type="number" inputmode="numeric" min="12" max="90" placeholder="Age" value="${p.age||''}" style="width:96px" onchange="setBio('age',this.value)"> years <input id="ht" type="number" inputmode="numeric" min="120" max="230" placeholder="Height" value="${p.ht||''}" style="width:96px" onchange="setBio('ht',this.value)"> cm</div>
 <label class="f">Sex</label><div class="f2">${sx('m','Male')}${sx('f','Female')}</div>
 <div class="mute" style="margin-top:8px">Age and sex set your pace, weekly volume, strength work, heart-rate zones and calorie estimates.</div>`}
function setBio(k,v){const p=cur();
 if(k==='sex')p.sex=v;
 else{const r={age:[12,90],ht:[120,230]}[k];v=Math.round(+v);if(!v||v<r[0]||v>r[1]){delete p[k];save();render();return toast((k==='age'?'Age':'Height')+' must be '+r[0]+'–'+r[1])}p[k]=v}
 save();render()}

const fd=s=>parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
let S,tab='today',view=null,arm=false,HYM=false;
function mk(name){const t=iso(new Date());return{name,start:t,end:addD(t,111),goal:120,rest:0,done:{}}}

/* ---- Extra storage: IndexedDB mirror, persistent storage, auto-snapshots ---- */
const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('forge-run',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
 async get(k){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}},
 async set(k,v){try{const d=await this.open();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(1);t.onerror=()=>rej(t.error)})}catch(e){return 0}},
 async del(k){try{const d=await this.open();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res(1);t.onerror=()=>rej(t.error)})}catch(e){return 0}},
 async keys(){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return []}}};
let mirT=0;
function mirror(){clearTimeout(mirT);mirT=setTimeout(async()=>{try{const t=JSON.stringify(S);await IDB.set('state',t);
 const day='snap:'+iso(new Date());if(!(await IDB.get(day))){await IDB.set(day,t);const ks=(await IDB.keys()).filter(k=>String(k).startsWith('snap:')).sort();while(ks.length>7)await IDB.del(ks.shift())}}catch(e){}},400)}
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist){if(await navigator.storage.persisted())return 1;return await navigator.storage.persist()}}catch(e){}return 0}
async function storInfo(){const el=$('#stor');if(!el)return;let t='';try{const ok=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():0;
 let u='';if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();u=' Using '+(e.usage/1048576).toFixed(2)+' MB of about '+Math.round(e.quota/1048576)+' MB available.'}

 const e2=$('#stor');if(e2)e2.textContent=t}
function bkDownload(){try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='forge-run-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Backup file saved')}catch(e){toast('Could not save a file. Use Copy backup instead.')}}
function bkFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.profiles||!o.profiles[o.active])throw 0;S=o;view=null;save();render();toast('Backup restored')}catch(e){toast('That is not a valid backup file')}inp.value=''};r.readAsText(f)}
async function bkAuto(){const ks=(await IDB.keys()).filter(k=>String(k).startsWith('snap:')).sort();if(!ks.length)return toast('No automatic backup yet');const t=await IDB.get(ks[ks.length-1]);try{const o=JSON.parse(t);if(!o.profiles||!o.profiles[o.active])throw 0;S=o;view=null;save();render();toast('Restored backup from '+String(ks[ks.length-1]).slice(5))}catch(e){toast('Automatic backup is damaged')}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.profiles){S={active:'p1',profiles:{p1:mk('Runner')}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!save.w){save.w=1;toast('Progress is stored in a backup copy only. Use Backup in Settings.')}}mirror()}
const cur=()=>S.profiles[S.active];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

const SA=[['Bodyweight squats','15 reps'],['Reverse lunges','10 per leg'],['Glute bridges','15 reps'],['Calf raises','20 reps'],['Wall sit','40 sec'],['Plank','40 sec']];

function plan(p){
 const R=rc(p),n=diff(p.start,p.end)+1,W=Math.ceil(n/7),gp=p.goal*60/R.km,pk=Math.max(1,W-3),out=[],ep=gp+85+R.se,kmOf=(m,s)=>m*60/s,V=agV(p),B=V.k==='b',OL=(p.age||0)>=50,E=V.k==='e',HY=p.mode==='hyb',s0=p.wk?Math.min(R.lp*V.vm*.7,Math.max(5,p.wk*.3)):R.l0*V.vm;
 const P=(a,b)=>fp(gp+a+R.se)+'–'+fp(gp+b+R.se)+' /km',Q=(a,b)=>fp(gp+a+R.sh)+'–'+fp(gp+b+R.sh)+' /km';
 const LK=w=>{if(w>=W-1)return R.rw;if(w===W-2&&W>=6)return R.tp;let L=s0+((R.u?Math.min(R.lp*V.vm,R.km*.8):R.lp*V.vm)-s0)*Math.min(w,pk)/pk;if((w+1)%4===0&&w<pk)L*=.8;return Math.round(L)};
 for(let i=0;i<n;i++){
  const date=addD(p.start,i),dow=parse(date).getDay(),w=Math.floor(i/7),L=LK(w),tp=W>=6&&w>=W-2;

  else if(slot===0||((B||OL)&&slot===5))d={t:'rest',mn:0,kp:0,e:'😴',title:'Rest day',sub:'Full recovery',l:['No training today. A light walk or stretching is fine.','Sleep 7–9 hours and drink plenty of water.']};
  else if(i===n-2)d={t:'run',mn:20,kp:kmOf(20,ep),e:'🏃',title:'Pre-race shakeout',sub:'Keep it light',l:['15–20 min very easy jog or walk','Optional: 5 × 20 sec relaxed strides','Prepare your kit, eat a carb-rich dinner, sleep early.']};
  else if(HY&&(slot===2||slot===4||(slot===5&&!(R.u&&!tp))))d=hyb(p,{slot,w,tp,B,E,OL,W,P,ep});
  else if(B&&slot===1&&w%2===1&&!tp){const f=Math.min(8,4+Math.floor(w/3));d={t:'run',mn:10+f*3,kp:kmOf(10+f*3,ep),e:'🎯',title:'Fartlek run',sub:f+' × 1 min brisk',l:['5 min easy jog or walk warm-up',f+' × 1 min brisk (7 out of 10), then 2 min easy jog or walk','5 min easy cool-down','Brisk means faster than easy, but you can still speak a few words.']}}
  else if(slot===1&&w%4===3&&!tp){const py=w<(E?5:8)?[400,800,1200,800,400]:E&&w>=9?[400,800,1200,1600,2000,1600,1200,800,400]:[400,800,1200,1600,1200,800,400],tk=py.reduce((a,b)=>a+b,0)/1000;
   d={t:'run',mn:Math.round(20+tk*(gp-27+R.sh)/60+tk*.5*ep/60),kp:kmOf(20,ep)+tk*1.5,e:'🔺',title:'Pyramid intervals',sub:py.join(' · ')+' m',l:['10 min easy jog warm-up','Go up the pyramid, then back down: '+py.join(' m, ')+' m','400 m reps at '+Q(-45,-30)+', 800 m at '+Q(-35,-20)+', 1200 m and longer at '+Q(-25,-10),'Easy jog between reps, half the rep distance (about '+Math.round(tk*500)+' m in total)','10 min easy jog cool-down']}}
  else if(slot===1&&w%2===1&&!tp){const r=E?Math.min(12,6+Math.floor(w/2)):Math.min(8,4+Math.floor(w/3));d={t:'run',mn:Math.round(20+r*.8*(gp-27+R.sh)/60+r*.4*ep/60),kp:kmOf(20,ep)+r*1.2,e:'⚡',title:'Interval run',sub:r+' × 800 m',l:['10 min easy jog warm-up',r+' × 800 m at '+Q(-35,-20),'400 m easy jog between each rep','10 min easy jog cool-down']}}
  else if(slot===1){const e=Math.round(L*(E?.5:.4)+2);d={t:'run',mn:Math.round(e*ep/60),kp:e,e:'🏃',title:'Easy run',sub:e+' km',l:[e+' km at easy pace: '+P(70,100)+hz(p,.65,.75),'You should be able to talk in full sentences.',...(B&&w<W*.35?['Run/walk: run 3 min, walk 1 min, repeat. Walking is part of the plan.']:[])]}}
  else if(slot===5&&R.u&&!tp){const b=Math.round(L*.5);d={t:'run',mn:Math.round(b*ep/60),kp:b,e:'🔁',title:'Back-to-back run',sub:b+' km',l:[b+' km easy on tired legs: '+P(70,100),'Running on tired legs prepares you for the late miles of the race.','Rehearse your race-day food and drink.']}}
  else if(slot===2||slot===5){const s=tp?2:B?2:E?3:w<W*.35?2:3,A=slot===2;
   d={t:'str',rd:s,mn:Math.round(s*8.4),kp:4.5*s*8.4/60,e:'💪',title:A?'Strength A: legs':'Strength B: core and balance',sub:'No equipment · '+s+' rounds',l:[s+' rounds, rest '+((p.age||0)>=40?60:45)+' sec between exercises',...[...(A?SA:SB),...sxEx(p,A)].map(x=>x[0]+': '+x[1])]}}
  else if(B&&slot===3){const e=Math.round(L*.35+1);d={t:'run',mn:Math.round(e*ep/60),kp:e,e:'🏃',title:'Easy run',sub:e+' km',l:[e+' km at easy pace: '+P(70,100)+hz(p,.65,.75),'Keep it conversational. Walk breaks are fine.']}}
  else if(slot===3){const m=tp?12:E?Math.min(R.te||50,22+Math.round(w*1.8)):Math.min(R.tm||35,14+Math.round(w*1.4)),h=Math.round(m/2),b=m>=24;
   d={t:'run',mn:20+m+(b?2:0),kp:kmOf(20,ep)+kmOf(m,gp-10+R.sh)+(b?kmOf(2,ep):0),e:'⚡',title:'Tempo run',sub:m+' min at tempo',l:['10 min easy jog warm-up',b?'2 × '+h+' min tempo at '+Q(-15,-5)+', 2 min easy jog between':m+' min tempo at '+Q(-15,-5),'Tempo feels comfortably hard: only short sentences'+hz(p,.82,.89)+'.','10 min easy jog cool-down']}}
  else if(E&&slot===4&&!tp){const e=Math.round(L*.45+3);d={t:'run',mn:Math.round(e*ep/60),kp:e,e:'🏃',title:'Recovery run + strides',sub:e+' km',l:[e+' km very easy: '+P(90,120)+hz(p,.6,.7),'Finish with 6 × 20 sec relaxed strides, walk back to recover.']}}
  else if(slot===4){const m=tp?30:B?Math.min(50,25+w*2):Math.min(75,40+w*3);
   d={t:'bike',mn:m,kp:(B?6:w%2===0?7:8)*m/60,bk:(B?16:w%2===0?19:22)*m/60,e:'🚴',title:'Cycling',sub:m+' min',l:w%2===0||B?[m+' min steady ride, '+(B?'easy effort (4 out of 10)':'moderate effort (5 out of 10)'),'Cadence about 85–95 rpm']:['10 min easy warm-up',Math.min(6,3+Math.floor(w/4))+' × 4 min hard (8 out of 10), 3 min easy between','Easy spin for the rest of the '+m+' min']}}
  else d={t:'run',mn:Math.round(L*(ep-10)/60),kp:L,e:'🏃',title:'Long run',sub:L+' km',l:[L+' km at long-run pace: '+P(60,90)+hz(p,.65,.78),'Slow and steady. Practise drinking water on the move.',...(B?['Walk breaks are fine: walk 1 min every 10 min.']:[]),...(E&&!R.u&&!tp&&w>=pk-3?['Fast finish: run the last '+Math.round(L*.25)+' km at goal pace, '+fp(gp)+' /km.']:[]),...(R.u?['Practise race fuelling: 40–60 g of carbs per hour.']:[]),...(R.v?['Aim for about '+Math.round(L*R.v/10)*10+' m of climbing. Hike the steep climbs, run the rest.']:[])]};
  out.push({...d,date,w,ph,i})}
 return{days:out,W,gp}}

/* Hybrid sessions: run + ride + bodyweight strength, no gym equipment */
const MODES={run:{n:'Running plan',d:'Runs, cycling and strength on separate days. The standard plan.'},hyb:{n:'Hybrid: run + ride + strength',d:'No gym needed. Combines a bike ride, a run and bodyweight strength in the same session (ride then legs, ride then run, run then core). Key runs stay. Needs any bike.'}};
function hyb(p,o){const{slot,w,tp,B,E,OL,P,ep}=o,rt=(p.age||0)>=40?60:45,

 rds=n=>n+' round'+(n>1?'s':''),
 mk=(k,e,title,sub,rm,rk,s,l)=>{const sm=Math.round(s*8.4),rn=Math.round(rk*10)/10,bk=Math.round((B?16:19)*rm/60*10)/10;
  return{t:'hyb',k,e,title,sub,mn:Math.round(rm+rk*ep/60+sm),rn,bk,rd:s,kp:rn+7*rm/60+4.5*sm/60,l}},
 note='No gym needed: your own bodyweight, a stair or a park bench.';
 if(slot===2){const rm=tp?15:B?Math.round(15+Math.min(w,6)*1.5):E?25+Math.min(w,8)*2:Math.round(20+Math.min(w,8)*1.5),s=tp?1:B?(w>=6?2:1):E?3:2;
  return mk('ha','🚴💪','Hybrid A: ride + legs',rm+' min ride + '+rds(s),rm,0,s,[
   'Part 1 · Ride '+rm+' min, steady and easy to moderate (4–5 out of 10), cadence about 85–95 rpm'+hz(p,.6,.75),
   'Part 2 · Legs circuit: '+rds(s)+', rest '+rt+' sec between exercises. Go straight from the bike into it.',

let AUTH=null,authed=false,fails=0,until=0,fg=0;
try{AUTH=JSON.parse(localStorage.getItem('hm-auth-v1')||'null')}catch(e){}
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
const newSalt=()=>hx(crypto.getRandomValues(new Uint8Array(16)));
function saveAuth(){try{localStorage.setItem('hm-auth-v1',JSON.stringify(AUTH))}catch(e){}IDB.set('auth',JSON.stringify(AUTH))}
function showLock(){document.body.classList.add('locked');if(AUTH&&AUTH.lock)return showFail();const first=!AUTH,el=$('#lock');
 el.innerHTML=`<div class="card" style="width:100%;max-width:380px"><div class="lg" style="display:block;width:104px;height:104px;margin:0 auto 10px"></div><h2 style="text-align:center;font-size:32px">${first?'Create your login':'Welcome back'}</h2><div class="mute" style="text-align:center">${first?'Choose a username and password. You will need them every time you open this plan.':'Log in to open your training plan.'}</div>
 <label class="f" for="lu">Username</label><input id="lu" autocomplete="username" maxlength="24" style="width:100%">
 <label class="f" for="lp">Password</label><input id="lp" type="password" autocomplete="${first?'new-password':'current-password'}" style="width:100%">
 ${first?'<label class="f" for="lc">Confirm password</label><input id="lc" type="password" autocomplete="new-password" style="width:100%">'+qFields():''}
 <div id="le" class="mute" role="alert" style="color:#ff6b57;min-height:20px;margin-top:8px"></div>
 <button class="done" style="margin-top:6px" onclick="doAuth()">${first?'Create login':'Log in'}</button>
 ${first?'':'<button id="fb" class="btn g" style="width:100%;margin-top:10px" onclick="forgot()">Forgot password?</button>'}</div>`;
 el.onkeydown=e=>{if(e.key==='Enter')doAuth()}}
async function doAuth(){const e=$('#le'),u=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value;
 if(!(window.crypto&&crypto.subtle)){e.textContent='This browser cannot secure a password here.';return}
 if(!u||!pw){e.textContent='Enter a username and password.';return}
 if(!AUTH){if(pw.length<6){e.textContent='Use at least 6 characters.';return}
  if(pw!==$('#lc').value){e.textContent='Passwords do not match.';return}
  const i1=+$('#q1').value,i2=+$('#q2').value,a1=nz($('#a1').value),a2=nz($('#a2').value);
  if(i1===i2){e.textContent='Choose two different questions.';return}
  if(a1.length<2||a2.length<2){e.textContent='Answer both recovery questions.';return}
  const s=newSalt();AUTH={u,s,h:await hashPw(pw,s),q:await mkQ([[i1,a1],[i2,a2]])};saveAuth();return unlock()}
 if(Date.now()<until){e.textContent='Too many tries. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.';return}
 if(u===AUTH.u&&await hashPw(pw,AUTH.s)===AUTH.h){fails=0;unlock()}
 else{fails++;if(fails>=5){until=Date.now()+30000;fails=0}e.textContent='Wrong username or password.'}}
function unlock(){authed=true;document.body.classList.remove('locked');$('#lock').innerHTML='';render();scrollTo(0,0)}
function logout(){authed=false;$('#hdr').innerHTML='';$('#app').innerHTML='';showLock()}
async function chPw(){const o=$('#op').value,n=$('#np2').value;if(n.length<6)return toast('Use at least 6 characters');
 if(await hashPw(o,AUTH.s)!==AUTH.h)return toast('Current password is wrong');
 AUTH.s=newSalt();AUTH.h=await hashPw(n,AUTH.s);saveAuth();$('#op').value='';$('#np2').value='';toast('Password changed')}
const QS=['What was the name of your first pet?','What city were you born in?','What was the name of your first school?','What is your mother’s maiden name?','What was your childhood best friend’s name?','What was your first phone number’s last 4 digits?'];
const nz=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
async function mkQ(a){const r=[];for(const[i,t]of a){const s=newSalt();r.push({i,s,h:await hashPw(t,s)})}return r}
function qFields(){const o=QS.map((q,i)=>`<option value="${i}">${q}</option>`).join('');
 return`<div class="mute" style="margin-top:14px">Recovery questions: if you forget your password, you must answer both correctly. One wrong answer locks the login and the training plan must be reset.</div>
 <label class="f" for="q1">Question 1</label><select id="q1" style="width:100%">${o}</select><input id="a1" placeholder="Your answer" autocomplete="off" style="width:100%;margin-top:6px">
 <label class="f" for="q2">Question 2</label><select id="q2" style="width:100%">${o.replace('value="1"','value="1" selected')}</select><input id="a2" placeholder="Your answer" autocomplete="off" style="width:100%;margin-top:6px">`}
async function saveQ(){const i1=+$('#q1').value,i2=+$('#q2').value,a1=nz($('#a1').value),a2=nz($('#a2').value);
 if(await hashPw($('#qp').value,AUTH.s)!==AUTH.h)return toast('Current password is wrong');
 if(i1===i2)return toast('Choose two different questions');
 if(a1.length<2||a2.length<2)return toast('Answer both questions');
 AUTH.q=await mkQ([[i1,a1],[i2,a2]]);saveAuth();render();toast('Recovery questions saved')}
function forgot(){if(!AUTH.q)showFail('noq');else showRecover()}
function showRecover(){const el=$('#lock');
 el.innerHTML=`<div class="card" style="width:100%;max-width:380px"><div class="lg" style="display:block;width:104px;height:104px;margin:0 auto 10px"></div><h2 style="text-align:center;font-size:30px">Reset password</h2><div class="mute" style="text-align:center">Answer both questions. Careful: one wrong answer locks the login and you must reset the training plan.</div>
 <label class="f" for="r1">${QS[AUTH.q[0].i]}</label><input id="r1" autocomplete="off" style="width:100%">
 <label class="f" for="r2">${QS[AUTH.q[1].i]}</label><input id="r2" autocomplete="off" style="width:100%">
 <label class="f" for="rp">New password</label><input id="rp" type="password" autocomplete="new-password" style="width:100%">
 <label class="f" for="rc">Confirm new password</label><input id="rc" type="password" autocomplete="new-password" style="width:100%">
 <div id="le" class="mute" role="alert" style="color:#ff6b57;min-height:20px;margin-top:8px"></div>
 <button class="done" onclick="doRecover()">Reset password</button><button class="btn g" style="width:100%;margin-top:10px" onclick="showLock()">Back</button></div>`;el.onkeydown=null}
async function doRecover(){const e=$('#le'),a1=nz($('#r1').value),a2=nz($('#r2').value),n=$('#rp').value;
 if(!a1||!a2){e.textContent='Answer both questions.';return}
 if(n.length<6){e.textContent='New password: at least 6 characters.';return}
 if(n!==$('#rc').value){e.textContent='Passwords do not match.';return}
 const c1=(await hashPw(a1,AUTH.q[0].s))===AUTH.q[0].h,c2=(await hashPw(a2,AUTH.q[1].s))===AUTH.q[1].h;
 if(!(c1&&c2)){AUTH.lock=1;saveAuth();return showFail()}
 AUTH.s=newSalt();AUTH.h=await hashPw(n,AUTH.s);saveAuth();unlock();toast('Password reset')}
function showFail(k){document.body.classList.add('locked');const el=$('#lock');el.onkeydown=null;fg=0;
 el.innerHTML=`<div class="card" style="width:100%;max-width:380px"><div class="lg" style="display:block;width:104px;height:104px;margin:0 auto 10px"></div><h2 style="text-align:center;font-size:30px">${k==='noq'?'No recovery questions':'Login locked'}</h2><div class="mute" style="text-align:center;margin-top:6px">${k==='noq'?'You did not set recovery questions, so the password cannot be recovered.':'An answer was wrong, so you cannot log in.'} The only way forward is to reset the training plan. This erases all your sessions, progress and settings.</div>
 <button id="rb" class="btn r" style="width:100%;margin-top:14px;padding:13px" onclick="resetPlan()">Reset training plan</button>${k==='noq'?'<button class="btn g" style="width:100%;margin-top:10px" onclick="showLock()">Back</button>':''}</div>`}
function resetPlan(){if(!fg){fg=1;$('#rb').textContent='Tap again to erase everything';return}
 try{localStorage.removeItem('hm-auth-v1');localStorage.removeItem(KEY)}catch(e){}IDB.keys().then(ks=>Promise.all(ks.map(k=>IDB.del(k)))).then(()=>{AUTH=null;fg=0;load();showLock()})}
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=$('#ib');if(b)b.style.display=''});
function doInstall(){if(!dip)return toast('Use your browser menu: Install app');dip.prompt();dip=null}
function shareApp(){const u=location.href.split('#')[0];if(navigator.share)navigator.share({title:'Forge To Fit running plan',text:'An offline running plan. Open the link once, then add it to your Home Screen.',url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast('Link copied')}catch(e){toast(u)}}}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{let a=null,st=null;try{a=localStorage.getItem('hm-auth-v1');st=localStorage.getItem(KEY)}catch(e){}
 if(!a||!st){const ia=await IDB.get('auth'),is=await IDB.get('state');
  try{if(!a&&ia){localStorage.setItem('hm-auth-v1',ia);AUTH=JSON.parse(ia)}}catch(e){}
  try{if(!st&&is)localStorage.setItem(KEY,is)}catch(e){}}
 else{IDB.set('auth',a);IDB.set('state',st)}
 askPersist();load();showLock();})();
</script></body></html>
